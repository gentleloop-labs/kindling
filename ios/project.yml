name: Kindling
options:
  bundleIdPrefix: dev.aftaab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  KindlingCore:
    path: Packages/KindlingCore
  KindlingUI:
    path: Packages/KindlingUI

targets:
  Kindling:
    type: application
    platform: iOS
    sources:
      - path: Kindling
    dependencies:
      - package: KindlingCore
      - package: KindlingUI
      - target: KindlingWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aftaab.kindling
        PRODUCT_NAME: Kindling
        INFOPLIST_FILE: Kindling/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kindling/Kindling.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  KindlingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KindlingWidget
    dependencies:
      - package: KindlingCore
      - package: KindlingUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aftaab.kindling.widget
        PRODUCT_NAME: KindlingWidget
        INFOPLIST_FILE: KindlingWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: KindlingWidget/KindlingWidget.entitlements
        ENABLE_PREVIEWS: YES

schemes:
  Kindling:
    build:
      targets:
        Kindling: all
    run:
      config: Debug
      # Local StoreKit products, so the paywall and the entitlement paths are
      # testable without the Paid Applications Agreement, App Store Connect, or a
      # sandbox Apple ID — all of which have external latency we do not control.
      # Debug only; Release talks to the real App Store.
      storeKitConfiguration: Kindling.storekit
    archive:
      config: Release
