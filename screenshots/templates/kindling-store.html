<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="kindling-store.css">
</head>
<body class="variant-{{variant}}">
  <main class="store-shot">

</html>
