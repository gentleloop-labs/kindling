<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="kindling-store-inviting.css">
</head>
<body class="variant-{{variant}}">
  <main class="store-shot">
    <div class="sun-wash" aria-hidden="true"></div>
    <div class="route route-one" aria-hidden="true"></div>
    <div class="route route-two" aria-hidden="true"></div>

    <header class="copy">
      <div class="eyebrow"><span>✦</span> {{kicker}}</div>
      <h1>
        <span>{{headline_before}}</span>
        <em>{{headline_accent}}</em>
        <span>{{headline_after}}</span>
      </h1>
      <p>{{supporting}}</p>
    </header>

    <section class="app-frame" aria-hidden="true">
      <img src="{{screen}}" alt="">
    </section>

    <aside class="ember-scene" aria-hidden="true">
      <div class="speech">
        <strong>{{mascot_message}}</strong>
        <span>{{mascot_submessage}}</span>
      </div>
      <img src="{{mascot}}" alt="">
    </aside>

    <div class="feature-sticker" aria-hidden="true">
      <span class="sticker-icon">{{sticker_icon}}</span>
      <span>{{sticker_label}}</span>
    </div>

    <div class="spark spark-one" aria-hidden="true">✦</div>
    <div class="spark spark-two" aria-hidden="true">✦</div>
    <div class="spark spark-three" aria-hidden="true">●</div>
  </main>
</body>
</html>
