project:
  name: Kindling App Store screenshots
  device: iPhone 17 Pro Max - Deep Blue - Portrait
  output_dir: framed/en-US
  output_size: iPhone6_5

screenshots:
  01-remember:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/01-remember.png
    variables:
      variant: remember
      headline_before: Remember where
      headline_accent: life happened.
      headline_after: ""
      supporting: Turn scattered travel photos into a private memory trail.

  02-atlas:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/02-atlas.png
    variables:
      variant: atlas
      headline_before: See every trip in your
      headline_accent: private atlas.
      headline_after: ""
      supporting: No account. No public feed. Your memories stay yours.

  03-memory-trail:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/03-memory-trail.png
    variables:
      variant: trail
      headline_before: Relive the places and
      headline_accent: moments.
      headline_after: ""
      supporting: Photos, notes, voice memories, and an approximate map path.

  04-find-it:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/04-find-it.png
    variables:
      variant: search
      headline_before: Find the detail you
      headline_accent: almost forgot.
      headline_after: ""
      supporting: Search places, notes, Sparks, tags, and return intent locally.

  05-share-safely:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/05-share-safely.png
    variables:
      variant: share
      headline_before: Preview privacy before
      headline_accent: you share.
      headline_after: ""
      supporting: Choose exactly which dates, places, notes, and moments appear.
