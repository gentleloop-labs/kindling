project:
  name: Kindling App Store screenshots
  device: iPhone 17 Pro Max - Deep Blue - Portrait
  output_dir: framed/en-US
  output_size: iPhone6_5

screenshots:
  01-remember:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/01-remember.png
    variables:
      variant: remember
      headline_before: Photos become a
      headline_accent: memory trail.
      headline_after: ""
      supporting: Kindling groups a whole trip into editable moments—automatically.

  02-atlas:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/02-atlas.png
    variables:
      variant: atlas
      headline_before: Every trip in your
      headline_accent: private atlas.
      headline_after: ""
      supporting: See the places, dates, and moments that made each journey yours.

  03-memory-trail:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/03-memory-trail.png
    variables:
      variant: trail
      headline_before: Follow the story,
      headline_accent: not the camera roll.
      headline_after: ""
      supporting: Move through the map and the moments in the order they happened.

  04-find-it:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/04-find-it.png
    variables:
      variant: search
      headline_before: Remember what
      headline_accent: photos missed.
      headline_after: ""
      supporting: Add notes, voice memories, private tags, and gentle prompts.

  05-share-safely:
    frame: false
    template: templates/kindling-store.html
    assets:
      screen: raw/en-US/iPhone_17_Pro_Max_-_Deep_Blue_-_Portrait/05-share-safely.png
    variables:
      variant: share
      headline_before: Share the story—
      headline_accent: keep control.
      headline_after: ""
      supporting: Preview exactly which dates, places, notes, and moments leave your phone.
